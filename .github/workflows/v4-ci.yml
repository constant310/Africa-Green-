name: V4 CI

on:
  push:
    branches: [ main, v4-production ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Verify required routes exist
        run: |
          set -euo pipefail
          test -f app/page.tsx
          test -f app/login/page.tsx
          test -f app/register/page.tsx
          test -f app/onboarding/page.tsx
          test -f app/portal/page.tsx
          test -f app/loans/page.tsx
          test -f app/withdrawals/page.tsx
          test -f app/activity/page.tsx
          test -f app/notifications/page.tsx
          test -f app/documents/page.tsx
          test -f app/admin/page.tsx
          test -f app/admin/withdrawals/page.tsx
          test -f app/admin/support/page.tsx
          test -f app/admin/readiness/page.tsx
          test -f app/admin/reports/page.tsx
          test -f app/admin/audit-export/page.tsx
          test -f app/auth/callback/page.tsx
          test -f app/api/health/route.ts
          test -f app/api/admin/audit-export/route.ts
          test -f app/api/paystack/registration/route.ts
          test -f app/api/paystack/wallet/route.ts
          test -f app/api/paystack/verify-wallet/route.ts
          test -f app/api/paystack/reconcile-wallet/route.ts
          test -f app/api/paystack/banks/route.ts
          test -f app/api/paystack/resolve-account/route.ts
          test -f app/api/paystack/withdrawal-transfer/route.ts
          test -f app/api/paystack/webhook/route.ts
          test -f app/api/kyc/dojah/route.ts
