name: Deploy JAMB Telegram Bot to Netlify

on:
  push:
    branches: [ telegram-jamb-bot-test ]
    paths:
      - 'telegram-bot-netlify/**'
      - '.github/workflows/netlify-jamb-bot.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy bot backend to Netlify
        working-directory: telegram-bot-netlify
        run: >-
          npx -y @netlify/mcp@latest
